<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Pride of Tirumala</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pride Apt" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="app-icon">🏛️</div>
      <h1 class="login-title">The Pride of Tirumala</h1>
      <p class="login-sub">Apartment Maintenance Portal</p>
      <p class="login-desc">Manage maintenance payments &amp; expenses for your apartment complex</p>

      <button class="btn btn-google" onclick="signIn()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <div id="auth-error" class="hidden"></div>

      <p class="login-footer">
        This app accesses your Google Sheets to store apartment data.<br>
        No data is stored on any external server.
      </p>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app-shell" class="hidden">

    <!-- Top Header (desktop + mobile) -->
    <header id="top-header">
      <div class="header-left">
        <span class="header-icon">🏛️</span>
        <div class="header-title-group">
          <h1 class="header-title">The Pride of Tirumala</h1>
          <span class="header-subtitle">Maintenance Portal</span>
        </div>
      </div>

      <!-- Desktop nav -->
      <nav id="desktop-nav">
        <button class="nav-link active" data-page="dashboard" onclick="navigate('dashboard')">
          <span class="nav-icon">📊</span> Dashboard
        </button>
        <button class="nav-link" data-page="flats" onclick="navigate('flats')">
          <span class="nav-icon">🏠</span> Flats &amp; Payments
        </button>
        <button class="nav-link" data-page="expenses" onclick="navigate('expenses')">
          <span class="nav-icon">💸</span> Expenses
        </button>
      </nav>

      <div class="header-right">
        <span id="user-name"></span>
        <span id="access-badge" class="access-badge hidden"></span>
        <button id="backup-btn" class="btn btn-backup hidden" onclick="backupSheet()" title="Create a timestamped backup of the Google Sheet">
          💾 Backup
        </button>
        <button class="btn btn-signout" onclick="signOut()">Sign Out</button>
      </div>
    </header>

    <main id="main-content">
      <div class="loading">Loading…</div>
    </main>

    <!-- Mobile bottom navigation -->
    <nav id="mobile-nav">
      <button class="mob-nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="mob-nav-icon">📊</span>
        <span class="mob-nav-label">Dashboard</span>
      </button>
      <button class="mob-nav-btn" data-page="flats" onclick="navigate('flats')">
        <span class="mob-nav-icon">🏠</span>
        <span class="mob-nav-label">Flats</span>
      </button>
      <button class="mob-nav-btn" data-page="expenses" onclick="navigate('expenses')">
        <span class="mob-nav-icon">💸</span>
        <span class="mob-nav-label">Expenses</span>
      </button>
      <button id="mob-backup-btn" class="mob-nav-btn hidden" onclick="backupSheet()">
        <span class="mob-nav-icon">💾</span>
        <span class="mob-nav-label">Backup</span>
      </button>
    </nav>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal-overlay" class="hidden">
    <div class="modal">
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Save</button>
      </div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast"></div>

  <!-- ============ SCRIPTS ============ -->
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/flats.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/app.js"></script>

  <!-- Google APIs -->
  <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
  <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>

</body>
</html>
